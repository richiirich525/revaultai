<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found | RevaultAI</title>
<link rel="icon" href="/favicon-32.png" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0e0f14; --text:#e8e8ea; --muted:#8a8a95; --border:#26262f; --accent:#7B3FE4; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); padding:24px; }
  main { max-width:460px; text-align:center; }
  .logo { font-family:'Cormorant Garamond',serif; font-size:26px; color:var(--muted);
          text-decoration:none; display:inline-block; margin-bottom:28px; }
  h1 { font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase;
       color:var(--accent); margin:0 0 14px; font-weight:400; }
  p { font-family:'DM Mono',monospace; font-size:12px; line-height:2; color:var(--muted); margin:0 0 28px; }
  nav { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  a.btn { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
          color:var(--muted); text-decoration:none; border:1px solid var(--border); border-radius:3px;
          padding:9px 16px; transition:color .2s,border-color .2s; }
  a.btn:hover { color:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>
  <main>
    <a class="logo" href="/">RevaultAI</a>
    <h1>Page not found</h1>
    <p>This page doesn't exist, or it moved. The films are all still here.</p>
    <nav>
      <a class="btn" href="/">Home</a>
      <a class="btn" href="/explore">Browse films</a>
      <a class="btn" href="/tools">Tools</a>
      <a class="btn" href="/blog">Journal</a>
    </nav>
  </main>
</body>
</html>
